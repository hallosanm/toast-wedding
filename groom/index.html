<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我们结婚啦 - 男方请柬</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f11; color: #fff; }
    
    /* 滑动容器 */
    #appContainer { width: 100%; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; }
    .page { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    /* 音乐播放按钮 */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .music-disc {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #e0c38c;
      box-shadow: 0 0 5px rgba(224, 195, 140, 0.5);
    }
    .music-btn.playing .music-disc {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 背景音乐 -->
  <audio id="bgm" src="./bgm.mp3" preload="auto" loop playsinline="-webkit-playsinline" x5-playsinline></audio>

  <!-- 音乐悬浮按钮 -->
  <div class="music-btn" id="musicBtn" onclick="toggleMusic()">
    <div class="music-disc"></div>
  </div>

  <!-- 主页面结构 -->
  <div id="appContainer">
    <div class="page" style="background: linear-gradient(180deg, #1a1a24 0%, #0f0f11 100%);">
      <h2>男方婚礼邀请函</h2>
      <p style="margin-top: 10px; color: #a0a0a0;">点击或滑动页面触发音乐播放</p>
    </div>
  </div>

  <script>
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');
    let isUserInteracted = false;

    // 播放/暂停控制
    function toggleMusic() {
      if (bgm.paused) {
        playBgm();
      } else {
        bgm.pause();
      }
    }

    function playBgm() {
      const playPromise = bgm.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          musicBtn.classList.add('playing');
        }).catch(err => {
          console.log('自动播放被阻止，等待用户手势解锁:', err);
        });
      }
    }

    // 状态事件监听：确保 UI 状态与真实播放状态强一致
    bgm.addEventListener('playing', () => musicBtn.classList.add('playing'));
    bgm.addEventListener('pause', () => musicBtn.classList.remove('playing'));
    bgm.addEventListener('waiting', () => musicBtn.classList.remove('playing'));

    // 优化的唤醒唤醒逻辑（全方位手势捕获）
    function unlockAudio() {
      if (isUserInteracted) return;
      
      bgm.play().then(() => {
        isUserInteracted = true;
        removeUnlockListeners();
      }).catch(err => {
        // 忽略 Promise error，等待下一次手势触发
      });
    }

    function removeUnlockListeners() {
      const events = ['touchstart', 'touchend', 'pointerdown', 'click', 'scroll'];
      events.forEach(evt => {
        window.removeEventListener(evt, unlockAudio, true);
        document.getElementById('appContainer')?.removeEventListener(evt, unlockAudio, true);
      });
    }

    function initAudioWakeup() {
      // 1. 微信环境下的原生自动播放支持
      if (typeof WeixinJSBridgeReady !== 'undefined' || typeof window.WeixinJSBridge !== 'undefined') {
        const wxPlay = () => {
          window.WeixinJSBridge.invoke('getNetworkType', {}, () => {
            playBgm();
          }, false);
        };
        if (typeof window.WeixinJSBridge === 'undefined') {
          document.addEventListener('WeixinJSBridgeReady', wxPlay, false);
        } else {
          wxPlay();
        }
      }

      // 2. 全局通用触控唤醒监听
      const events = ['touchstart', 'touchend', 'pointerdown', 'click', 'scroll'];
      events.forEach(evt => {
        window.addEventListener(evt, unlockAudio, { capture: true, passive: true });
        document.getElementById('appContainer')?.addEventListener(evt, unlockAudio, { capture: true, passive: true });
      });

      // 3. 页面切回前台时，若未在播放则重试
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !isUserInteracted && bgm.paused) {
          unlockAudio();
        }
      });
    }

    // 页面加载完成后初始化播放器唤醒
    window.addEventListener('DOMContentLoaded', initAudioWakeup);
  </script>
</body>
</html>
