<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>葛思远 & 方紫瑜 · 婚礼邀请函</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF6F0;
            --accent-gold: #c69c59;
            --text-dark: #3a322c;
            --text-muted: #8c786a;
            --border-color: #e2d3c1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Noto Serif SC', 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }
        .portal-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 2px solid var(--accent-gold);
            border-radius: 18px;
            padding: 36px 20px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(198, 156, 89, 0.2);
        }
        .seal {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            margin: 0 auto 16px;
            box-shadow: 0 6px 16px rgba(198, 156, 89, 0.35);
        }
        .title-en { font-family: 'Cinzel Decorative', serif; font-size: 13px; letter-spacing: 3px; color: var(--accent-gold); margin-bottom: 6px; }
        .names { font-size: 22px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .sub { font-size: 13px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 28px; }
        .btn-group { display: flex; flex-direction: column; gap: 14px; }
        .nav-btn {
            display: block;
            padding: 16px 14px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }
        .nav-btn-groom {
            background: var(--accent-gold);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(198, 156, 89, 0.35);
        }
        .nav-btn-bride {
            background: #ffffff;
            color: var(--accent-gold);
            border: 1.5px solid var(--accent-gold);
            box-shadow: 0 4px 12px rgba(198, 156, 89, 0.1);
        }
        .btn-tag { font-size: 11px; letter-spacing: 1px; opacity: 0.85; margin-bottom: 4px; display: block; }
        .btn-main { font-size: 16px; font-weight: 700; letter-spacing: 2px; }
        .btn-info { font-size: 12px; margin-top: 4px; opacity: 0.9; }
        .footer { margin-top: 28px; font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="seal">💌</div>
        <div class="title-en">WEDDING INVITATION</div>
        <div class="names">葛思远  ♥  方紫瑜</div>
        <div class="sub">— 诚邀莅临 · 见证幸福 —</div>
        
        <div class="btn-group">
            <a href="/groom/" class="nav-btn nav-btn-groom">
                <span class="btn-tag">GROOM BANQUET</span>
                <div class="btn-main">✦ 男方宴请请柬 ✦</div>
                <div class="btn-info">2026.09.19 11:38 · 合肥肥东希尔顿</div>
            </a>
            
            <a href="/bride/" class="nav-btn nav-btn-bride">
                <span class="btn-tag">BRIDE BANQUET</span>
                <div class="btn-main">✦ 女方宴请请柬 ✦</div>
                <div class="btn-info">2026.09.27 11:28 · 旌德海螺国际大酒店</div>
            </a>
        </div>
        
        <div class="footer">
            2026 AUTUMN WEDDING · 爱很简答
        </div>
    </div>
</body>
</html>
